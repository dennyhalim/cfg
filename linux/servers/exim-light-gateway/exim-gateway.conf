# Lightweight Exim SMTP gateway
# Exim 4.100+ recommended.
#
# Replace:
#   gateway1.example.net
# and install the companion files as documented in README.md.

primary_hostname = gateway1.example.net

# Gateway only; it does not host local mailboxes.
domainlist local_domains =
hostlist relay_from_hosts = 127.0.0.1 : ::1

daemon_smtp_ports = 25
message_size_limit = 50M
recipients_max = 100
smtp_receive_timeout = 5m
smtp_accept_max = 100
smtp_accept_max_per_host = 15

# Keep these conservative. A single reputation hit normally tags only.
GATEWAY_BLOCKLIST = /var/lib/exim4/light-gateway/blocklist.ipl
GATEWAY_IP_SCORES = /etc/exim4/light-gateway-ip-scores
GATEWAY_DOMAIN_SCORES = /etc/exim4/light-gateway-domain-scores
DNSBL_STRONG = zen.spamhaus.org
DNSBL_MEDIUM = bl.spamcop.net
RHSBL_DOMAIN = dbl.spamhaus.org

SCORE_LOCAL_IP = 4
SCORE_DNSBL_STRONG = 4
SCORE_DNSBL_MEDIUM = 2
SCORE_RHSBL = 2
SCORE_NO_PTR = 1
SCORE_BAD_HELO = 1
SCORE_RATE = 2

SCORE_DEFER = 5
SCORE_REJECT = 7

acl_smtp_connect = acl_check_connect
acl_smtp_helo = acl_check_helo
acl_smtp_mail = acl_check_mail
acl_smtp_rcpt = acl_check_rcpt
acl_smtp_data = acl_check_data

# Optional TLS. Uncomment and point these at your gateway certificate.
# tls_advertise_hosts = *
# tls_certificate = /etc/exim4/tls/fullchain.pem
# tls_privatekey = /etc/exim4/tls/privkey.pem

begin acl

acl_check_connect:

  # Connection-level reputation score.
  warn
    set acl_c_score = 0
    set acl_c_hits =

  # Manual source IP/CIDR score. Positive = less trusted, negative = more trusted.
  # iplsearch uses the FIRST matching entry, so put specific networks first.
  warn
    condition = ${if exists{GATEWAY_IP_SCORES}{yes}{no}}
    set acl_c_ip_score = ${lookup{$sender_host_address}iplsearch{GATEWAY_IP_SCORES}{$value}{0}}
    condition = ${if !={$acl_c_ip_score}{0}{yes}{no}}
    set acl_c_score = ${eval:$acl_c_score + $acl_c_ip_score}
    set acl_c_hits = ${if def:acl_c_hits{$acl_c_hits,ip-score=$acl_c_ip_score}{ip-score=$acl_c_ip_score}}
    log_message = light-gateway manual IP score=$acl_c_ip_score ip=$sender_host_address

  # Local downloaded IP/CIDR list. iplsearch supports IPv4/IPv6 CIDR.
  warn
    condition = ${if exists{GATEWAY_BLOCKLIST} \
                  {${if match_ip{$sender_host_address}{iplsearch;GATEWAY_BLOCKLIST}{yes}{no}}} \
                  {no}}
    set acl_c_score = ${eval:$acl_c_score + SCORE_LOCAL_IP}
    set acl_c_hits = ${if def:acl_c_hits{$acl_c_hits,local-ip}{local-ip}}
    log_message = light-gateway local IP list hit: $sender_host_address

  # Strong DNSBL. Keep this as a score, not an unconditional reject.
  warn
    dnslists = DNSBL_STRONG
    set acl_c_score = ${eval:$acl_c_score + SCORE_DNSBL_STRONG}
    set acl_c_hits = ${if def:acl_c_hits{$acl_c_hits,dnsbl-strong}{dnsbl-strong}}
    log_message = light-gateway DNSBL hit: $dnslist_domain $dnslist_value

  # Secondary DNSBL signal.
  warn
    dnslists = DNSBL_MEDIUM
    set acl_c_score = ${eval:$acl_c_score + SCORE_DNSBL_MEDIUM}
    set acl_c_hits = ${if def:acl_c_hits{$acl_c_hits,dnsbl-medium}{dnsbl-medium}}
    log_message = light-gateway DNSBL hit: $dnslist_domain $dnslist_value

  # Missing reverse DNS is a weak signal only.
  warn
    condition = ${if !def:sender_host_name{yes}{no}}
    set acl_c_score = ${eval:$acl_c_score + SCORE_NO_PTR}
    set acl_c_hits = ${if def:acl_c_hits{$acl_c_hits,no-ptr}{no-ptr}}

  # Connection burst control using Exim's own hints DB.
  warn
    ratelimit = 30 / 5m / per_conn / strict
    set acl_c_score = ${eval:$acl_c_score + SCORE_RATE}
    set acl_c_hits = ${if def:acl_c_hits{$acl_c_hits,conn-rate}{conn-rate}}
    log_message = light-gateway connection rate: $sender_rate/$sender_rate_period

  accept


acl_check_helo:

  # Verify HELO/EHLO, but score rather than hard-reject.
  warn
    !verify = helo
    condition = ${if !def:acl_c_badhelo{yes}{no}}
    set acl_c_badhelo = 1
    set acl_c_score = ${eval:$acl_c_score + SCORE_BAD_HELO}
    set acl_c_hits = ${if def:acl_c_hits{$acl_c_hits,bad-helo}{bad-helo}}
    log_message = light-gateway HELO verify failed: $sender_helo_name

  accept


acl_check_mail:

  # Copy the connection score into this message.
  warn
    set acl_m_score = ${if def:acl_c_score{$acl_c_score}{0}}
    set acl_m_hits = ${if def:acl_c_hits{$acl_c_hits}{}}

  # Manual envelope-sender domain score.
  # nwildlsearch supports exact keys and wildcard keys such as *.example.com.
  # Positive = less trusted, negative = more trusted.
  warn
    condition = ${if and{{def:sender_address_domain}{exists{GATEWAY_DOMAIN_SCORES}}}{yes}{no}}
    set acl_m_domain_score = ${lookup{$sender_address_domain}nwildlsearch{GATEWAY_DOMAIN_SCORES}{$value}{0}}
    condition = ${if !={$acl_m_domain_score}{0}{yes}{no}}
    set acl_m_score = ${eval:$acl_m_score + $acl_m_domain_score}
    set acl_m_hits = ${if def:acl_m_hits{$acl_m_hits,domain-score=$acl_m_domain_score}{domain-score=$acl_m_domain_score}}
    log_message = light-gateway manual domain score=$acl_m_domain_score domain=$sender_address_domain

  # Sender-domain RHSBL. Skip null senders (bounces).
  warn
    condition = ${if def:sender_address_domain{yes}{no}}
    dnslists = RHSBL_DOMAIN/$sender_address_domain
    set acl_m_score = ${eval:$acl_m_score + SCORE_RHSBL}
    set acl_m_hits = ${if def:acl_m_hits{$acl_m_hits,rhsbl}{rhsbl}}
    log_message = light-gateway RHSBL hit: $sender_address_domain at $dnslist_domain

  # Message-rate signal. Exim keeps this state itself.
  warn
    ratelimit = 100 / 1h / per_mail / strict
    set acl_m_score = ${eval:$acl_m_score + SCORE_RATE}
    set acl_m_hits = ${if def:acl_m_hits{$acl_m_hits,msg-rate}{msg-rate}}
    log_message = light-gateway message rate: $sender_rate/$sender_rate_period

  accept


acl_check_rcpt:

  # Permit local injection if needed for administrative testing.
  accept
    hosts = +relay_from_hosts

  # Hard reject only after combined signals reach the high threshold.
  deny
    condition = ${if >= {$acl_m_score}{SCORE_REJECT}{yes}{no}}
    message = Rejected by gateway reputation policy
    log_message = light-gateway reject score=$acl_m_score hits=$acl_m_hits

  # Medium-risk senders receive a temporary error. A real MTA should retry.
  defer
    condition = ${if >= {$acl_m_score}{SCORE_DEFER}{yes}{no}}
    message = Temporary gateway reputation deferral; please retry
    log_message = light-gateway defer score=$acl_m_score hits=$acl_m_hits

  # Protect against recipient spraying independently of reputation scoring.
  defer
    ratelimit = 200 / 1h / per_rcpt / strict
    message = Too many recipients from this sender host; please retry
    log_message = light-gateway recipient rate: $sender_rate/$sender_rate_period

  # This is the relay-control boundary.
  # Verification invokes gateway_mx_route below. mxroute.py succeeds only if:
  #   1. this gateway is present in the recipient domain's MX set, and
  #   2. at least one non-gateway MX remains as a backend.
  deny
    !verify = recipient
    message = Relay not permitted for this domain
    log_message = light-gateway unroutable/unauthorized domain: $domain

  accept


acl_check_data:

  # Cheap syntax check; content scanning belongs on the real mail server.
  deny
    !verify = header_syntax
    message = Invalid message header syntax

  # Informational headers for the backend. Never use these as authentication.
  warn
    add_header = X-Light-Gateway: $primary_hostname
    add_header = X-Light-Gateway-Score: ${if def:acl_m_score{$acl_m_score}{0}}
    add_header = X-Light-Gateway-Hits: ${if def:acl_m_hits{$acl_m_hits}{none}}

  accept


begin routers

gateway_mx_route:
  driver = queryprogram
  command = /usr/local/libexec/exim-light-gateway/mxroute.py $domain
  command_user = Debian-exim
  transport = gateway_smtp
  no_more


begin transports

gateway_smtp:
  driver = smtp
  # Do not require TLS by default: many MX backends use opportunistic TLS.
  # Uncomment only if every backend is guaranteed to support TLS.
  # hosts_require_tls = *


begin retry

# Standard temporary SMTP/DNS failures.
*                      *           F,2h,15m; G,16h,1h,1.5; F,4d,6h


begin rewrite


begin authenticators
