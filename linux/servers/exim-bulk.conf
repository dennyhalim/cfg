# MAIN
primary_hostname = mail.example.com
domainlist local_domains = @ : example.com
domainlist relay_to_domains =
hostlist relay_from_hosts = 127.0.0.1 : ::1
hostlist bulk_whitelist = /etc/exim/bulk_whitelist.txt
domainlist bulk_sender_domains = /etc/exim/bulk_sender_domains.txt

# /etc/exim/bulk_whitelist.txt -> one IP per line
# /etc/exim/bulk_sender_domains.txt -> one domain per line (bulk1.com)

acl_smtp_rcpt = acl_check_rcpt
acl_smtp_data = acl_check_data
acl_smtp_mail = acl_check_mail

never_users = root
host_lookup = *
rfc1413_hosts = *
rfc1413_query_timeout = 0s

tls_advertise_hosts = *
auth_advertise_hosts = *

log_selector = +all

# ROUTERS
begin routers

dnslookup:
  driver = dnslookup
  domains = !+local_domains
  transport = remote_smtp
  no_more

system_aliases:
  driver = redirect
  allow_fail
  allow_defer
  data = ${lookup{$local_part}lsearch{/etc/aliases}}
  user = mailnull
  group = mail
  file_transport = address_file
  pipe_transport = address_pipe

localuser:
  driver = accept
  check_local_user
  transport = local_delivery
  cannot_route_message = Unknown user

# TRANSPORTS
begin transports

#DKIM
#mkdir /etc/exim/dkim
#openssl genrsa -out /etc/exim/dkim/bulk1.com.key 2048
#openssl rsa -in /etc/exim/dkim/bulk1.com.key -pubout -out /tmp/pub.key
#DNS: v=DKIM1; k=rsa; p=MIGfMA0GCSqG... [content of pub.key]

remote_smtp:
  driver = smtp
  dkim_domain = $sender_address_domain
  dkim_selector = eximbulk
  dkim_private_key = /etc/exim/dkim/${dkim_domain}.key
  dkim_canon = relaxed

local_delivery:
  driver = appendfile
  file = /var/mail/$local_part
  delivery_date_add
  envelope_to_add
  return_path_add
  group = mail
  mode = 0600

address_pipe:
  driver = pipe
  return_output

address_file:
  driver = appendfile
  delivery_date_add
  envelope_to_add
  return_path_add

# ACLs
begin acl

acl_check_mail:
  accept
    hosts = +bulk_whitelist
    sender_domains = +bulk_sender_domains

  deny
    hosts = +bulk_whitelist
    message = Envelope FROM domain $sender_address_domain not whitelisted for $host_address

  accept

acl_check_rcpt:

  accept
    hosts = :

  deny
    message = Restricted characters in address
    domains = +local_domains
    local_parts = ^[.] : ^.*[@%!/|]

  deny
    message = Relay not permitted - IP $host_address not whitelisted
    domains = !+local_domains
    !hosts = +relay_from_hosts
    !hosts = +bulk_whitelist

  # BULK WHITELIST - IP + sender domain already checked in MAIL ACL
  accept
    hosts = +bulk_whitelist
    sender_domains = +bulk_sender_domains
    control = submission/sender_retain
    ratelimit = 1000 / 1h / per_conn / strict
    logwrite = BULK OK $host_address $envelope_from -> $recipients

  accept
    hosts = +relay_from_hosts
    control = submission/sender_retain

  accept
    domains = +local_domains
    endpass
    verify = recipient

  deny
    message = Relay not permitted

acl_check_data:

  # Enforce From: header matches whitelisted domain for bulk IPs
  deny
    hosts = +bulk_whitelist
    condition = ${if !match_domain{${domain:$h_From:}}{+bulk_sender_domains}{1}{0}}
    message = From: header domain ${domain:$h_From:} not whitelisted

  # Too many recipients
  deny
    hosts = +bulk_whitelist
    condition = ${if >{$recipients_count}{100}{1}{0}}
    message = Too many recipients - max 100

  # Block empty body / spam-ish
  deny
    condition = ${if ={$h_X-Spam-Flag:}{YES}{1}{0}}
    message = Message marked as spam

  accept

begin authenticators

# if you need auth
PLAIN:
  driver = plaintext
  public_name = PLAIN
  server_condition = ${if eq{$auth2}{password}{1}{0}}
  server_set_id = $auth2

LOGIN:
  driver = plaintext
  public_name = LOGIN
  server_prompts = Username:: : Password::
  server_condition = ${if eq{$auth2}{password}{1}{0}}
  server_set_id = $auth1
